<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Kirish — Mazmun Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
  <style>
    body{min-height:100vh; display:grid; place-items:center; background:
            radial-gradient(1000px 500px at 0% 0%, rgba(30,123,255,.06), transparent 60%),
            radial-gradient(900px 500px at 100% 100%, rgba(30,123,255,.06), transparent 55%);}
    .card{border:1px solid #eef0f5; border-radius:18px; box-shadow:0 18px 42px rgba(0,0,0,.06);}
    .brand{display:flex; align-items:center; gap:.6rem; font-weight:800;}
    .brand img{height:28px;}
  </style>
</head>
<body>
<div class="container" style="max-width:460px">
  <div class="text-center mb-3 brand">
    <img src="/files/logo.png" alt="logo"><span>Mazmun Admin</span>
  </div>
  <div class="card">
    <form id="frm" class="card-body p-4">
      <h4 class="fw-bold mb-3">Kirish</h4>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input id="username" class="form-control" required>
      </div>
      <div class="mb-2">
        <label class="form-label">Parol</label>
        <input id="password" class="form-control" type="password" minlength="3" required>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        <div class="form-text">Faqat ruxsat etilgan foydalanuvchilar uchun.</div>
        <button class="btn btn-primary rounded-pill" type="submit">
          Kirish <i class="bi bi-arrow-right-short"></i>
        </button>
      </div>
      <div id="err" class="text-danger small mt-2 d-none"></div>
    </form>
  </div>
</div>

<script>
  const LOGIN_API = '/api/auth/login';
  const WHOAMI    = '/api/auth/me';

  function decodeJwt(t){
    try{ return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }
    catch{ return {}; }
  }

  // <-- YANGI: rollarni har xil formatdan massivga aylantiradi
  function normalizeRoles(input){
    if (!input) return [];
    if (Array.isArray(input)) {
      return input
              .map(r => typeof r === 'string' ? r : (r.authority || r.roleName || r.name || ''))
              .filter(Boolean);
    }
    if (typeof input === 'string') {
      // ba'zan '["ROLE_ADMIN"]' ko'rinishida ham kelishi mumkin
      try { const j = JSON.parse(input); if (Array.isArray(j)) return j.map(String); } catch {}
      return input.split(/[,\s]+/).filter(Boolean);
    }
    if (typeof input === 'object') {
      if (input.authority || input.roleName || input.name)
        return [input.authority || input.roleName || input.name].filter(Boolean);
      return normalizeRoles(Object.values(input).flat()); // {0: "..."} yoki boshqa shakllar
    }
    return [];
  }

  function go(roleList){
    const roles = normalizeRoles(roleList);
    if (roles.includes('ROLE_SUPER_ADMIN'))      location.href = '/super-admin';
    else if (roles.includes('ROLE_ADMIN'))       location.href = '/admin';
    else {
      const err = document.getElementById('err');
      err.classList.remove('d-none');
      err.textContent = 'Sizga panelga kirishga ruxsat yo‘q.';
    }
  }

  document.getElementById('frm').onsubmit = async (e)=>{
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    const err = document.getElementById('err');
    err.classList.add('d-none');

    try{
      // 1) login -> token
      const {data} = await axios.post(LOGIN_API, {username, password});
      const token = data?.token || data?.accessToken || data?.jwt;
      if(!token) throw new Error('Token topilmadi');
      localStorage.setItem('jwt', token);

      // 2) rollarni token yoki /me dan olish
      const p = decodeJwt(token);
      let roles = normalizeRoles(p.roles || p.authorities);

      if (!roles.length) {
        try {
          const me = await axios.get(WHOAMI, {headers:{Authorization:'Bearer '+token}});
          roles = normalizeRoles(me.data?.roles || me.data?.authorities);
        } catch {}
      }
      go(roles);
    }catch(ex){
      err.classList.remove('d-none');
      err.textContent = 'Login xato. Username/parolni tekshiring.';
      console.error(ex);
    }
  };
</script>

</body>
</html>
