# --- Server (prod) konfiguratsiya ---

# Port
server.port=9090
spring.data.rest.base-path=/api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mazmunwebdb
spring.datasource.username=mazmunweb
spring.datasource.password=mazmunwebdb123
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Frontend bazaviy URL (reset linklar uchun)
app.base-url=https://mazmunedu.uz
app.password-reset.ttl-minutes=20

# Fayl upload katalogi (serverda alohida papka)
app.upload.dir=/home/mazmun/mazmunweb-data/uploads

# Fayl hajm limitlari
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Error va loglar (prod uchun uncha shovqin bo'lmasin)
server.error.include-message=always
server.error.include-binding-errors=always
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http.converter.json=INFO
