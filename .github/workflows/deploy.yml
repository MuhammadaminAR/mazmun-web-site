name: CI/CD MazmunWEB

on:
  push:
    branches: [ "master" ]   # master ga push bo'lsa ishga tushadi
  workflow_dispatch:          # Actions dan qo'lda ham ishga tushirish mumkin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy JAR to server
        run: |
          scp -i ~/.ssh/id_rsa target/MazmunWebLogin-0.0.1-SNAPSHOT.jar \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/mazmun/mazmunweb/MazmunWebLogin-0.0.1-SNAPSHOT.jar

      - name: Restart service on server
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo systemctl restart mazmunweb && sudo systemctl status mazmunweb --no-pager"
