name: CI/CD MazmunWEB

on:
  push:
    branches: [ "master" ]   # master ga push bo'lsa ishga tushadi
  workflow_dispatch:          # Actions dan qo'lda ham ishga tushirish mumkin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: List target directory
        run: ls -l target

      - name: Configure SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 72.61.136.31 >> ~/.ssh/known_hosts

      - name: Copy JAR to server
        run: |
          set -e
          scp -v -i ~/.ssh/id_rsa target/MazmunWebLogin-0.0.1-SNAPSHOT.jar mazmun@72.61.136.31:/home/mazmun/mazmunweb/MazmunWebLogin-0.0.1-SNAPSHOT.jar

      - name: Restart service on server
        run: |
          set -e
          ssh -v -i ~/.ssh/id_rsa mazmun@72.61.136.31 "sudo systemctl restart mazmunweb && sudo systemctl status mazmunweb --no-pager"
